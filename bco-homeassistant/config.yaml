name: "BCO Home Assistant Gateway"
description: "The gateway between BCO and Home Assistant"
url: "https://www.basecubeone.org"
version: latest
slug: "bco-gateway-homeassistant"
panel_icon: mdi:cube-outline
arch:
  - aarch64
  - amd64
startup: application
image: openbaseorg/bco-gateway-homeassistent
homeassistant_api: true
environment:
  BCO_OPTIONS: "--host local-bco-middleware --port 13780"
