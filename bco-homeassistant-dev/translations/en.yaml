configuration:
  BCO_MIDDLEWARE_HOST:
    name: "BCO Middleware Host"
    description: "The hostname or IP address of the BCO Middleware service. This is the service that the Home Assistant gateway will connect to in order to access BCO's functionality."

  BCO_MIDDLEWARE_PORT:
    name: "BCO Middleware Port"
    description: "The port number on which the BCO Middleware service is listening. The default port is 13780."

  BCO_ADMIN:
    name: "BCO Admin Username"
    description: "The username of a BCO administrator account. This account will be used by the Home Assistant gateway to authenticate with the BCO Middleware service."

  BCO_ADMIN_PASSWORD:
    name: "BCO Admin Password"
    description: "The password of the BCO administrator account specified above."

  LOG_LEVEL:
    name: "Log Level"
    description: "The log level for the Home Assistant gateway. This controls the verbosity of the logs produced by the gateway. The available levels are: TRACE, DEBUG, INFO, WARN, ERROR, OFF."

  DEBUG_MODE:
    name: "Debug Mode"
    description: "When enabled, the Home Assistant gateway will produce more detailed logs for debugging purposes. This is useful for troubleshooting issues with the gateway."

  HOME_ASSISTANT_HOST:
    name: "Home Assistant Host"
    description: "The hostname or IP address of the Home Assistant instance that the gateway will connect to. This is typically 'supervisor' when running as a Home Assistant add on."

  HOME_ASSISTANT_PORT:
    name: "Home Assistant Port"
    description: "The port number on which the Home Assistant instance is listening. The default port is 80."

  HOME_ASSISTANT_WEBSOCKET_ENDPOINT:
    name: "Home Assistant WebSocket Endpoint"
    description: "The WebSocket endpoint for Home Assistant's real time API. The default is '/core/websocket'."

  HOME_ASSISTANT_REST_ENDPOINT:
    name: "Home Assistant REST Endpoint"
    description: "The REST API endpoint for Home Assistant. The default is '/core/api'."
