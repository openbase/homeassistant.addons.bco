name: "BCO Core"
description: "This is the BaseCubeOne core system providing a behaviour based automation approach and many more innovative smart home features."
url: "https://www.basecubeone.org"
version: latest
panel_icon: mdi:cube-outline
slug: "bco-core"
arch:
  - aarch64
  - amd64
startup: application
ports:
  13781/tcp: 13781
image: openbaseorg/bco
map:
  - type: addon_config
    read_only: False
watchdog: http://[HOST]:[PORT:13781]/graphql
timeout: 60
environment:
  BCO_OPTIONS: "--host addon_f71ff8bf_bco-middleware --port 13780 --database /config"
  BCO_USER_HOME: "/data"
  BCO_HOME: "/data"
