name: "BCO Connect Home Assistant (preview)"
description: "This is the unstable preview track of the gateway between BCO and Home Assistant"
url: "https://www.basecubeone.org"
version: preview+20251204-221537
slug: "bco-gateway-homeassistant-preview"
panel_icon: mdi:cube-outline
arch:
  - aarch64
  - amd64
startup: application
image: openbaseorg/bco-gateway-homeassistant
map:
  - type: share
    read_only: False
    path: /bco/data
homeassistant_api: true
hassio_api: true
options:
  BCO_MIDDLEWARE_HOST: addon_f71ff8bf_bco-middleware
  BCO_MIDDLEWARE_PORT: 13780
  BCO_ADMIN: ""
  BCO_ADMIN_PASSWORD: ""
  LOG_LEVEL: "INFO"
  DEBUG_MODE: false
  HOME_ASSISTANT_HOST: "supervisor"
  HOME_ASSISTANT_PORT: 80
  HOME_ASSISTANT_WEBSOCKET_ENDPOINT: "/core/websocket"
  HOME_ASSISTANT_REST_ENDPOINT: "/core/api"

schema:
  BCO_MIDDLEWARE_HOST: str?
  BCO_MIDDLEWARE_PORT: port?
  BCO_ADMIN: str?
  BCO_ADMIN_PASSWORD: password?
  LOG_LEVEL: list(TRACE|DEBUG|INFO|WARN|ERROR|OFF)
  DEBUG_MODE: bool?
  HOME_ASSISTANT_HOST: str?
  HOME_ASSISTANT_PORT: port?
  HOME_ASSISTANT_WEBSOCKET_ENDPOINT: list(/api/websocket|/core/websocket)
  HOME_ASSISTANT_REST_ENDPOINT: list(/api|/core/api)


#healthcheck:
#  test: ["CMD-SHELL", "nc -z -v -w5 homeassistant.local 13781 || exit 1"]
#  interval: "30s"
#  timeout: "10s"
#  retries: 3
environment:
  BCO_HOME: "/bco/data"
