name: "BCozy"
description: "Delivers the BCO user interface as a local web application within the network."
url: "https://www.basecubeone.org"
version: latest
slug: "bco-ui"
panel_icon: mdi:cube-outline
arch:
  - aarch64
  - amd64
startup: application
ports:
  80/tcp: 80
image: opaal/bco-ui-albiorix
webui: http://[HOST]:[PORT:80]
panel_admin: false
ingress: true
ingress_port: 8022
# ingress_entry: /. ## Modify the URL entry point.
# ingress_stream: false ## When enabled, requests to the add-on are streamed
